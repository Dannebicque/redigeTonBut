# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.annee_but: [1,2,3]
    api_key: '%env(resolve:API_KEY)%'
    pdf.storage_dir: '%kernel.project_dir%/var/pdfs'
    pdf.remote.base_url: '%env(PDF_REMOTE_BASE_URL)%'
    pdf.remote.api_token: '%env(PDF_REMOTE_API_TOKEN)%'
    pdf.remote.hmac_secret: '%env(PDF_REMOTE_HMAC_SECRET)%'
    pdf.callback.bearer: '%env(PDF_CALLBACK_BEARER)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Utils\Files:
        arguments:
            $kernelProjectDir: '%kernel.project_dir%'

    _instanceof:
        App\Pdf\PdfPayloadBuilderInterface:
            tags: ['app.pdf_payload_builder']

    App\Pdf\:
        resource: '../src/Pdf/'
        autowire: true
        autoconfigure: true

    App\Pdf\Builder\:
        resource: '../src/Pdf/Builder/'
        autowire: true
        autoconfigure: true

    App\Pdf\Builder\ReferentielPdfPayloadBuilder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Classes\Latex\GenereFile:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Pdf\PdfPayloadBuilderRegistry:
        arguments:
            $builders: !tagged_iterator app.pdf_payload_builder

    App\Controller\Pdf\:
        resource: '../src/Controller/Pdf/'
        tags: ['controller.service_arguments']

    App\Pdf\HmacSigner:
        arguments:
            $secret: '%pdf.remote.hmac_secret%'

    App\Pdf\PdfStorage:
        arguments:
            $storageDir: '%pdf.storage_dir%'

    App\Pdf\PdfRemoteClient:
        arguments:
            $baseUrl: '%pdf.remote.base_url%'
            $apiToken: '%pdf.remote.api_token%'

    App\Controller\Pdf\PdfCallbackController:
        arguments:
            $callbackBearer: '%pdf.callback.bearer%'
            $logger: '@monolog.logger.pdf_callback'
