monolog:
    channels: ['pdf_callback']
    handlers:
        main:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            level: debug
            channels: ["!event"]
        pdf_callback:
            type: stream
            path: "%kernel.logs_dir%/%kernel.environment%.pdf_callback.log"
            level: debug
            channels: ["pdf_callback"]
        # uncomment to get logging in your browser
        # you may have to allow bigger header sizes in your Web server configuration
        #firephp:
        #    type: firephp
        #    level: info
        #chromephp:
        #    type: chromephp
        #    level: info
        console:
            type: console
            process_psr_3_messages: false
            channels: ["!event", "!doctrine", "!console"]
